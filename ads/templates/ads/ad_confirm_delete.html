<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Удаление объявления</title>
</head>
<body>
    <h1>Удалить объявление "{{ ad.title }}"?</h1>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Да, удалить</button>
        <a href="{% url 'ads:detail' ad.pk %}">Отмена</a>
    </form>
</body>
</html>
